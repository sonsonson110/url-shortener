name: urlshortener-bench
services:
  app:
    build:
      context: /home/pson1410/source-code/projects/url-shortener
      dockerfile: Dockerfile
    cpu_period: 100000
    cpu_quota: 200000
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: urlshortener
      DB_URL: jdbc:postgresql://postgres:5432/urlshortener
      DB_USERNAME: urlshortener
      HIKARI_MAX_POOL_SIZE: "10"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      LOGGING_LEVEL_COM_URLSHORTENER: INFO
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/actuator/health | grep -q '"status":"UP"'
      timeout: 3s
      interval: 3s
      retries: 40
      start_period: 20s
    image: url-shortener:bench
    mem_limit: "1073741824"
    networks:
      default: null
    ports:
    - mode: ingress
      target: 8080
      published: "18080"
      protocol: tcp
  k6:
    profiles:
    - load
    cpu_period: 100000
    cpu_quota: 200000
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8080
    image: grafana/k6:0.54.0
    mem_limit: "2147483648"
    networks:
      default: null
    user: 1000:1000
    volumes:
    - type: bind
      source: /home/pson1410/source-code/projects/url-shortener/benchmarks/k6
      target: /scripts
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: /home/pson1410/source-code/projects/url-shortener/benchmarks/results/v0-naive/20261124T112449-saturation
      target: /results
      bind:
        create_host_path: true
  postgres:
    cpu_period: 100000
    cpu_quota: 200000
    command:
    - postgres
    - -c
    - shared_preload_libraries=pg_stat_statements
    - -c
    - shared_buffers=512MB
    - -c
    - effective_cache_size=1536MB
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_PASSWORD: urlshortener
      POSTGRES_USER: urlshortener
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U urlshortener -d urlshortener
      timeout: 3s
      interval: 3s
      retries: 20
    image: postgres:16-alpine
    mem_limit: "2147483648"
    networks:
      default: null
    shm_size: "1073741824"
networks:
  default:
    name: urlshortener-bench_default
